<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18252B">
<title>仓库（测试版）</title>
<style>
:root{
  --bg:#E9ECEA; --card:#FFFFFF; --ink:#18252B; --mute:#5F6E74; --line:#D3D9D6; --soft:#EEF1F0;
  --blue:#1D4E89; --yel:#F2C230; --red:#C23B2C; --green:#2F7A4D;
  --r:10px;
  font-family:"HarmonyOS Sans SC","PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2.5px solid var(--yel);outline-offset:2px}

header.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;height:50px;padding:0 12px 0 14px;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;margin:0;font-weight:700}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:#B9C6CC;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync i{width:8px;height:8px;border-radius:50%;background:#8a979c;flex:none}
.sync.ok i{background:#4CC27A}.sync.off i{background:var(--yel)}.sync.err i{background:#ff6b5b}
.me{background:rgba(255,255,255,.14);border-radius:999px;height:32px;padding:0 12px;font-size:14px;color:#fff;white-space:nowrap;max-width:42vw;overflow:hidden;text-overflow:ellipsis}

main{padding:0 12px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.banner{margin:10px 0 0;background:#FFF1C2;color:#5c4400;border-radius:8px;padding:8px 12px;font-size:13px}
.banner.err{background:#FBE1DD;color:#7d2219}
.searchbar{position:sticky;top:50px;z-index:15;background:var(--bg);padding:10px 0 4px}
.searchbar input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px;background:#fff;font-size:16px;-webkit-appearance:none}
.searchbar input:focus{outline:none;border-color:var(--blue)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:14px;color:var(--mute)}
.chip.on{background:var(--yel);border-color:var(--yel);color:var(--ink);font-weight:700}

.list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;background:#fff;padding:10px 12px;min-height:72px;text-align:left;width:100%}
.row:active{background:#F4F6F5}
.thumb{width:52px;height:52px;border-radius:8px;flex:none;background:#DDE3E0;display:grid;place-items:center;font-weight:700;color:var(--mute);font-size:20px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.mid{flex:1;min-width:0}
.nm{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qty{text-align:right;flex:none;max-width:40%}
.qty b{font-size:26px;font-weight:700;line-height:1}
.qty small{display:block;font-size:12px;color:var(--mute);margin-top:4px;white-space:nowrap}
.neg{color:var(--red)!important}
.foot{text-align:center;color:var(--mute);font-size:13px;margin:12px 0}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}

.h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 2px 8px}
.h h2{font-size:17px;margin:0}
.card{background:#fff;border-radius:var(--r);padding:12px;margin-bottom:10px}
.card .t1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .who{font-weight:700}
.card .when{font-size:13px;color:var(--mute)}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--soft);font-size:15px}
.line:first-of-type{border-top:0}
.line .mid small{display:block;color:var(--mute);font-size:12px}
.line input{width:84px;height:42px;border:1.5px solid var(--line);border-radius:8px;text-align:center;font-size:18px;font-weight:700}
.note{font-size:14px;color:var(--mute);margin-top:6px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:4px;background:var(--soft);color:var(--mute);white-space:nowrap}
.tag.y{background:#FFF1C2;color:#7A5A00}.tag.g{background:#DDF1E4;color:var(--green)}.tag.r{background:#FBE1DD;color:var(--red)}.tag.b{background:#DCE7F5;color:var(--blue)}

.btn{height:50px;border-radius:var(--r);padding:0 16px;font-size:17px;font-weight:600;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{height:40px;font-size:15px;padding:0 14px}
.btn.pri{background:var(--blue);color:#fff}
.btn.in{background:var(--green);color:#fff}
.btn.warn{background:#fff;border:1.5px solid var(--red);color:var(--red)}
.btn.line2{background:#fff;border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;margin-top:12px}.btns .btn{flex:1}
.link{color:var(--blue);font-weight:600;font-size:15px}

.menu{background:#fff;border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:0 14px;min-height:54px;border-top:1px solid var(--soft);font-size:16px}
.menu button:first-child{border-top:0}
.menu button small{color:var(--mute);font-size:13px}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;height:56px;font-size:15px;color:var(--mute);position:relative}
nav.tabs button.on{color:var(--blue);font-weight:700}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.badge{position:absolute;top:7px;left:calc(50% + 12px);background:var(--red);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-weight:700}

.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:25;height:52px;padding:0 20px;border-radius:26px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 14px rgba(29,78,137,.35)}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:25;background:var(--ink);color:#fff;border-radius:12px;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;font-size:15px}
.searchbar{display:flex;gap:8px}
.searchbar input{flex:1;min-width:0}
.selbtn{flex:none;height:48px;padding:0 14px;border-radius:var(--r);background:#fff;border:1.5px solid var(--line);font-size:15px;font-weight:600}
.selbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ck{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;background:#fff}
.row.picked{background:#EAF1FA}
.row.picked .ck{background:var(--blue);border-color:var(--blue)}
.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:25;background:var(--ink);color:#fff;border-radius:12px;min-height:56px;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 14px;font-size:15px}
.selbar span{flex:1}
.selbar .btn{height:42px;font-size:15px;padding:0 10px;background:rgba(255,255,255,.14);color:#fff}
.selbar .btn.del{background:var(--red)}
.cartbar .btn{height:40px;background:var(--yel);color:var(--ink);font-size:15px}

.mask{position:fixed;inset:0;background:rgba(10,20,25,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));animation:up .18s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-size:21px;margin:0}
.sheet .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.x{width:36px;height:36px;border-radius:50%;background:var(--soft);font-size:20px;line-height:36px;text-align:center;flex:none}
.field{margin-top:12px}
.field>label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;height:48px;border:1.5px solid var(--line);border-radius:8px;padding:0 12px;background:#fff;font-size:16px;-webkit-appearance:none}
.field textarea{height:72px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px}
.check input{width:22px;height:22px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.quick button{height:32px;padding:0 10px;border-radius:6px;background:var(--soft);font-size:14px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:56px;height:56px;border-radius:10px;background:var(--soft);font-size:28px;font-weight:600;flex:none}
.stepper input{flex:1;min-width:0;height:56px;text-align:center;font-size:28px;font-weight:700;border:1.5px solid var(--line);border-radius:10px;-webkit-appearance:none}
.stepper input:focus{outline:none;border-color:var(--blue)}
.stats{display:flex;gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.stats div{flex:1;background:#F6F8F7;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:24px;line-height:1.2}
.stats span{font-size:12px;color:var(--mute)}
.photo{width:100%;aspect-ratio:16/10;background:#DDE3E0;border-radius:12px;overflow:hidden;display:grid;place-items:center;color:var(--mute);position:relative;margin-bottom:12px;font-size:56px;font-weight:700}
.photo.small{aspect-ratio:auto;height:120px;font-size:15px;font-weight:400}
.photo.none{aspect-ratio:auto;height:84px;font-size:15px;font-weight:400;justify-content:start;padding-left:16px}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.photo.has{aspect-ratio:auto;display:block;background:#18252B;min-height:120px}
.photo.has img{height:auto;max-height:62vh;margin:0 auto;cursor:zoom-in}
.photo.small img{background:#18252B}
.viewer{position:fixed;inset:0;background:#000;z-index:90;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:24px}
.cam{position:absolute;right:10px;bottom:10px;background:rgba(24,37,43,.82);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.cam input,.filebtn input{display:none}
.filebtn{display:inline-flex}
.sec{margin-top:18px}
.sec h3{font-size:14px;color:var(--mute);margin:0 0 4px;font-weight:600}
.mini{font-size:14px;padding:8px 0;border-bottom:1px solid var(--soft);display:flex;justify-content:space-between;gap:8px}
.mini:last-child{border-bottom:0}
.mini span:last-child{color:var(--mute);white-space:nowrap}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{height:42px;padding:0 14px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:15px}
.seg button.on{border-color:var(--blue);background:#DCE7F5;color:var(--blue);font-weight:700}
.sugg{border:1px solid var(--line);border-radius:8px;margin-top:4px;overflow:hidden}
.sugg button{display:block;width:100%;text-align:left;padding:10px 12px;border-top:1px solid var(--soft);font-size:15px}
.sugg button:first-child{border-top:0}
.warnbox{background:#FFF1C2;color:#5c4400;border-radius:8px;padding:8px 12px;font-size:14px;margin-top:8px}
table.pv{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.pv th,table.pv td{border-bottom:1px solid var(--soft);padding:6px 4px;text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:10px;padding:12px 16px;z-index:80;display:flex;gap:16px;align-items:center;max-width:92vw;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{color:var(--yel);font-weight:700;font-size:15px}
.day{font-size:13px;color:var(--mute);margin:14px 2px 6px;font-weight:600}
.rec{display:flex;gap:10px;align-items:center;background:#fff;padding:10px 12px;border-top:1px solid var(--soft);width:100%;text-align:left}
.rec:first-child{border-top:0}
.rec .sign{font-weight:700;font-size:18px;white-space:nowrap}
.plus{color:var(--green)}.minus{color:var(--blue)}
.big{font-size:22px;font-weight:700;margin:6px 0}
.loc{display:inline-block;font-size:12px;font-weight:700;background:#DCE7F5;color:var(--blue);border-radius:4px;padding:0 6px;margin-right:6px;line-height:18px}
.loc.bad{background:#FBE1DD;color:var(--red)}
.code{font-size:18px;font-weight:700;color:var(--blue);margin:-2px 0 4px;letter-spacing:.3px;word-break:break-all}
.where{margin:10px 0 0;border:1.5px solid var(--blue);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.wbig{font-size:26px;font-weight:800;color:var(--blue);letter-spacing:1px;line-height:1.15;word-break:break-all}
.wsm{font-size:13px;color:var(--mute);text-align:right}
.kv{display:grid;grid-template-columns:92px 1fr;border-top:1px solid var(--soft)}
.kv div{padding:7px 0;border-bottom:1px solid var(--soft);font-size:14px;word-break:break-all}
.kv div:nth-child(odd){color:var(--mute);padding-right:8px}
.was{color:var(--mute);text-decoration:line-through;font-size:12px}
.eline{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.eline.off{opacity:.55}
.eline .t1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eline .specbox[hidden]{display:none}
.eline .row2{display:flex;gap:8px;align-items:center;margin-top:8px}
.eline .row2 input{width:96px;height:44px;border:1.5px solid var(--line);border-radius:8px;text-align:center;font-size:18px;font-weight:700}
.eline .specbox{display:flex;gap:6px;margin-top:8px}
.eline .specbox input{flex:1;min-width:0;height:42px;border:1.5px solid var(--line);border-radius:8px;padding:0 8px;font-size:15px}
</style>
</head>

<header class="top">
  <h1>仓库</h1>
  <div class="sync" id="sync"><i></i><span>连接中…</span></div>

<script type="module">
/* =========================================================
   仓库测试版
   把 Firebase 控制台给的 firebaseConfig 粘贴到下面（替换 null）。
   为 null 时是“本地演示模式”：数据只存在这部手机。
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDXR5i3jt2N0pEDCPqtqco6nh7E9AEIDs4",
  authDomain: "cangku-test-ca767.firebaseapp.com",
  projectId: "cangku-test-ca767",
  storageBucket: "cangku-test-ca767.firebasestorage.app",
  messagingSenderId: "204511919854",
  appId: "1:204511919854:web:f3e1360f46c62fddf33dff"
};
const FB_VER = '10.12.2';
const APP_VER = '2026-11-01 d';  // 每次改代码时改这里，用来确认手机上是不是新版

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const INC = n => ({ __inc: n });
const now = () => Date.now();
const r3 = n => Math.round((Number(n) || 0) * 1000) / 1000;
const fmt = n => String(r3(n));
const p2 = x => String(x).padStart(2, '0');
const fmtT = t => { const d = new Date(t); return `${p2(d.getMonth()+1)}-${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const fmtD = t => { const d = new Date(t); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; };
const fmtHM = t => { const d = new Date(t); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; };
const daysSince = t => Math.max(0, Math.floor((now() - t) / 86400000));
const readNum = v => { const n = parseFloat(String(v ?? '').replace(/，|,/g, '.').trim()); return Number.isFinite(n) ? r3(n) : NaN; };
const clean = o => { const r = {}; for (const k in o) if (o[k] !== undefined) r[k] = o[k]; return r; };
const isWeChat = () => /MicroMessenger/i.test(navigator.userAgent);
// 在安卓 App（Capacitor 外壳）里运行时为 true
const isApp = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const capPlugin = n => window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins[n];

/* ---------- 数据层：本地 / 云端 ---------- */
function makeLocal() {
  const KEY = 'ck_local_v1';
  let data; try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }
  const subs = [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast('手机存储空间不够，这次改动没保存'); } };
  const list = (c, opt) => {
    let a = Object.entries(data[c] || {}).map(([id, d]) => ({ id, ...d }));
    if (opt && opt.order) { a.sort((x, y) => (y[opt.order] || 0) - (x[opt.order] || 0)); if (opt.limit) a = a.slice(0, opt.limit); }
    return a;
  };
  const emit = () => subs.forEach(s => s.cb(list(s.c, s.opt), { cache: false, pending: false }));
  return {
    mode: 'local',
    sub(c, cb, opt) { subs.push({ c, cb, opt }); setTimeout(() => cb(list(c, opt), { cache: false, pending: false })); },
    async get(c, id) { const d = data[c] && data[c][id]; return d ? { id, ...JSON.parse(JSON.stringify(d)) } : null; },
    commit(ops) {
      for (const o of ops) {
        const col = data[o.c] || (data[o.c] = {});
        if (o.op === 'set') col[o.id] = JSON.parse(JSON.stringify(o.d));
        else if (o.op === 'upd') {
          const d = col[o.id]; if (!d) continue;
          for (const k in o.d) { const v = o.d[k]; d[k] = (v && typeof v === 'object' && '__inc' in v) ? r3((Number(d[k]) || 0) + v.__inc) : v; }
        } else if (o.op === 'del') delete col[o.id];
      }
      save(); emit();
    },
    reset() { data = {}; save(); emit(); }
  };
}

async function makeCloud(cfg) {
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [{ initializeApp }, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]);
  const app = initializeApp(cfg);
  let db;
  try { db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch (e) { console.warn(e); db = fs.getFirestore(app); }
  const conv = d => { const r = {}; for (const k in d) { const v = d[k]; r[k] = (v && typeof v === 'object' && '__inc' in v) ? fs.increment(v.__inc) : v; } return r; };
  return {
    mode: 'cloud',
    sub(c, cb, opt) {
      let q = fs.collection(db, c);
      if (opt && opt.order) q = fs.query(q, fs.orderBy(opt.order, 'desc'), fs.limit(opt.limit || 1000));
      fs.onSnapshot(q, { includeMetadataChanges: true },
        s => cb(s.docs.map(d => ({ id: d.id, ...d.data() })), { cache: s.metadata.fromCache, pending: s.metadata.hasPendingWrites }),
        err => dbError(err));
    },
    async get(c, id) {
      const ref = fs.doc(db, c, id); let s;
      try { s = await fs.getDocFromCache(ref); } catch (e) { s = await fs.getDoc(ref); }
      return s.exists() ? { id: s.id, ...s.data() } : null;
    },
    commit(ops) {
      for (let i = 0; i < ops.length; i += 400) {
        const b = fs.writeBatch(db);
        for (const o of ops.slice(i, i + 400)) {
          const ref = fs.doc(db, o.c, o.id);
          if (o.op === 'set') b.set(ref, conv(o.d)); else if (o.op === 'upd') b.update(ref, conv(o.d)); else b.delete(ref);
        }
        b.commit().catch(dbError); // 不等待：离线时先写本机，联网后自动上传
      }
    }
  };
}

const recOp = d => { const id = uid(); return { id, op: { op: 'set', c: 'records', id, d: clean({ t: now(), by: me ? me.name : '', ...d }) } }; };
const itemUpd = (id, d) => ({ op: 'upd', c: 'items', id, d });
const base = it => ({ itemId: it.id, name: it.name, spec: it.spec || '', unit: it.unit || '' });

function opsIn(it, q, note) {
  const r = recOp({ type: 'in', ...base(it), qty: q, note });
  return { ops: [itemUpd(it.id, { stock: INC(q), lu: now() }), r.op], rec: { id: r.id, ...r.op.d } };
}
function opsOut(it, q, person, note, reqId) {
  if (it.returnable) {
    const lendId = uid();
    const r = recOp({ type: 'lend', ...base(it), qty: q, person, note, lendId, reqId });
    return { ops: [
      itemUpd(it.id, { stock: INC(-q), lent: INC(q), lu: now() }),
      { op: 'set', c: 'lends', id: lendId, d: clean({ t: now(), ...base(it), person: person || '', qty: q, returned: 0, open: true, by: me.name }) },
      r.op], rec: { id: r.id, ...r.op.d } };
  }
  const r = recOp({ type: 'out', ...base(it), qty: q, person, note, reqId });
  return { ops: [itemUpd(it.id, { stock: INC(-q), lu: now() }), r.op], rec: { id: r.id, ...r.op.d } };
}
function auditOp(action, rec, extra) {

}
// 撤销/删除一条记录：把它对库存的影响反过来
function reverseOps(r) {
  const it = item(r.itemId); const ops = [];
  if (!it) return { err: '这样物品已被删除或合并，不能撤销。' };
  const q = r.qty;
  if (r.type === 'in' || r.type === 'new') ops.push(itemUpd(it.id, { stock: INC(-q) }));
  else if (r.type === 'out') ops.push(itemUpd(it.id, { stock: INC(q) }));
  else if (r.type === 'adjust') ops.push(itemUpd(it.id, { stock: INC(-q) }));
  else if (r.type === 'lend') {
    const l = S.lends.find(x => x.id === r.lendId);
    if (l && l.returned > 0) return { err: '这次借出已经有归还记录，请先删掉归还记录。' };
    ops.push(itemUpd(it.id, { stock: INC(q), lent: INC(-q) }));
    if (l) ops.push({ op: 'del', c: 'lends', id: l.id });
  } else if (r.type === 'return') {
    const l = S.lends.find(x => x.id === r.lendId);
    if (l) ops.push({ op: 'upd', c: 'lends', id: l.id, d: { returned: INC(-q), open: true } });
    if (r.state === '完好') ops.push(itemUpd(it.id, { stock: INC(-q), lent: INC(q) }));
    else if (r.state === '损坏') ops.push(itemUpd(it.id, { broken: INC(-q), lent: INC(q) }));
    else ops.push(itemUpd(it.id, { lent: INC(q) }));
  } else return { err: '这类记录不能删除。' };
  return { ops };
}
function deleteRecord(r, isUndo) {
  const x = reverseOps(r);
  if (x.err) { alert(x.err); return false; }
  const ops = [...x.ops, { op: 'del', c: 'records', id: r.id }];
  if (!isUndo) ops.push(auditOp('删除', r));
  DB.commit(ops);
  toast(isUndo ? '已撤销' : '已删除这条记录');
  return true;
}
function editRecordQty(r, nq) {
  const it = item(r.itemId); if (!it) { alert('这样物品已被删除或合并，不能修改。'); return false; }
  const d = r3(nq - r.qty); if (!d) return true;
  const ops = [];
  if (r.type === 'in' || r.type === 'new') ops.push(itemUpd(it.id, { stock: INC(d) }));
  else if (r.type === 'out') ops.push(itemUpd(it.id, { stock: INC(-d) }));
  else if (r.type === 'lend') {
    const l = S.lends.find(x => x.id === r.lendId);
    if (l && l.returned > nq) { alert(`已经还了 ${fmt(l.returned)}，借出数量不能少于这个数。`); return false; }
    ops.push(itemUpd(it.id, { stock: INC(-d), lent: INC(d) }));
    if (l) ops.push({ op: 'upd', c: 'lends', id: l.id, d: { qty: INC(d), open: (l.returned < nq) } });
  } else { alert('这类记录只能删除，不能改数量。'); return false; }
  ops.push({ op: 'upd', c: 'records', id: r.id, d: { qty: nq, edited: true } });
  ops.push(auditOp('修改', r, { newQty: nq }));
  DB.commit(ops); toast('已修改');
  return true;
}

const photoCache = new Map(), photoLoading = new Map();
async function loadPhoto(id, pv) {
  const key = id + ':' + (pv || 0);
  if (photoCache.has(key)) return photoCache.get(key);
  if (photoLoading.has(key)) return photoLoading.get(key);
  const p = DB.get('photos', id).then(d => { const src = d && d.img; if (src) photoCache.set(key, src); photoLoading.delete(key); return src; }).catch(() => { photoLoading.delete(key); return null; });
  photoLoading.set(key, p); return p;
}
let io;
function observePhotos(root) {
  if (!io) io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; io.unobserve(e.target);
    const el = e.target; loadPhoto(el.dataset.ph, el.dataset.pv).then(src => { if (src) el.innerHTML = `<img src="${src}" alt="" data-view>`; });
  }), { rootMargin: '300px' });
  root.querySelectorAll('[data-ph]').forEach(el => io.observe(el));
}
async function compress(file, max = 640, q = 0.6) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}
function savePhoto(it, src) {

  photoCache.set(it.id + ':' + pv, src);

}

const stepper = (name, val = 1) => `<div class="stepper" data-step><button type="button" data-d="-1" aria-label="减">−</button><input name="${name}" inputmode="decimal" value="${val}" autocomplete="off"><button type="button" data-d="1" aria-label="加">＋</button></div>`;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-step] [data-d]'); if (!b) return;
  const inp = b.parentElement.querySelector('input'); const v = readNum(inp.value) || 0;
  inp.value = fmt(Math.max(0, v + Number(b.dataset.d)));
});
let tt;
function toast(msg, undo) {
  document.querySelectorAll('.toast').forEach(x => x.remove()); clearTimeout(tt);
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button>撤销</button>' : ''}`;
  if (undo) t.querySelector('button').onclick = () => { t.remove(); undo(); };
  document.body.appendChild(t); tt = setTimeout(() => t.remove(), undo ? 6000 : 2600);
}

/* ---------- 物品详情 ---------- */
function openItem(id) {

  const uses = S.recs.filter(r => r.itemId === id && (r.type === 'out' || r.type === 'lend')).slice(0, 3);
  const lastLend = S.lends.filter(l => l.itemId === id)[0];
  const total = (it.stock || 0) + (it.lent || 0);
  const stats = `<div class="stats"><div><b class="num ${(it.stock || 0) < 0 ? 'neg' : ''}">${fmt(it.stock)}</b><span>在库（${esc(it.unit || '')}）</span></div>
    ${it.returnable ? `<div><b class="num">${fmt(it.lent)}</b><span>借出</span></div>${(it.broken || 0) > 0 ? `<div><b class="num">${fmt(it.broken)}</b><span>损坏</span></div>` : ''}<div><b class="num">${fmt(total)}</b><span>总数</span></div>` : ''}</div>`;

    <div class="field"><label>数量（${esc(it.unit || '')}）</label>${stepper('q', 1)}</div>

        toast(`已${it.returnable ? '借出' : '出库'} ${it.name} ${fmt(q)} ${it.unit || ''}`, () => deleteRecord(x.rec, true));

      saveCart(); closeSheet(); render(); toast(`已加入申报清单：${it.name} ${fmt(q)} ${it.unit || ''}`);

function openAdjust(it) {
  openSheet(`${head('盘点：' + esc(it.name), '数一数仓库里实际有多少，填进去。系统会自动记下差额。')}
    <div class="big num">系统数量 ${fmt(it.stock)} ${esc(it.unit || '')}</div>
    <div class="field"><label>实际数量（${esc(it.unit || '')}）</label>${stepper('q', fmt(Math.max(0, it.stock || 0)))}</div>
    <div class="btns"><button class="btn pri" id="ok">保存盘点</button></div>`, sh => {
    sh.querySelector('#ok').onclick = () => {
      const a = readNum(sh.querySelector('[name=q]').value); if (!(a >= 0)) return alert('请填写数量');
      const diff = r3(a - (it.stock || 0));
      if (!diff) { if (it.badQty) DB.commit([itemUpd(it.id, { badQty: false })]); closeSheet(); toast('数量一致，不用改'); return; }
      const r = recOp({ type: 'adjust', ...base(it), qty: diff, before: it.stock || 0, after: a });
      DB.commit([itemUpd(it.id, { stock: INC(diff), lu: now(), badQty: false }), r.op]); closeSheet();
      toast(`已盘点：${diff > 0 ? '+' : ''}${fmt(diff)} ${it.unit || ''}`, () => deleteRecord({ id: r.id, ...r.op.d }, true));
    };
  });
}

const UNITS = ['个', '根', '把', '卷', '米', '公斤', '吨', '盒', '包', '袋', '桶', '张', '套', '台', '双', '块', '箱'];
function similar(name, exceptId) {
  const n = name.trim().toLowerCase(); if (n.length < 1) return [];
  return S.items.filter(i => i.id !== exceptId && [i.name, i.alias].some(v => { v = String(v || '').toLowerCase(); return v && (v.includes(n) || n.includes(v.split(/[,，、 ]/)[0] || '###')); })).slice(0, 5);
}

function openMerge(src) {
  openSheet(`${head('合并重复物品', `把「${esc(src.name)}」并到另一样物品里，数量相加，「${esc(src.name)}」会被移除。`)}
    <div class="field"><input id="mq" placeholder="搜要并入的物品"></div><div id="ml"></div>`, sh => {
    const draw = () => {
      const q = sh.querySelector('#mq').value.trim();
      const l = S.items.filter(i => i.id !== src.id && matchQ(i, q)).slice(0, 30);
      sh.querySelector('#ml').innerHTML = `<div class="sugg">${l.map(i => `<button data-id="${i.id}">${esc(i.name)} ${esc(i.spec || '')}　<span class="sub">${fmt(i.stock)} ${esc(i.unit || '')}</span></button>`).join('') || '<button disabled>没有找到</button>'}</div>`;
    };
    sh.querySelector('#mq').addEventListener('input', draw); draw();
    sh.querySelector('#ml').addEventListener('click', e => {
      const b = e.target.closest('[data-id]'); if (!b) return; const dst = item(b.dataset.id);
      if ((src.unit || '') !== (dst.unit || '') && !confirm(`单位不一样（${src.unit || '无'} / ${dst.unit || '无'}），数量会直接相加，确定合并吗？`)) return;
      if (!confirm(`确定把「${src.name}」并到「${dst.name}」？`)) return;
      const ops = [itemUpd(dst.id, { stock: INC(src.stock || 0), lent: INC(src.lent || 0), broken: INC(src.broken || 0), lu: now() }),
        itemUpd(src.id, { deleted: true, mergedInto: dst.id })];
      S.lends.filter(l => l.itemId === src.id && l.open).forEach(l => ops.push({ op: 'upd', c: 'lends', id: l.id, d: { itemId: dst.id, name: dst.name } }));
      ops.push(recOp({ type: 'merge', ...base(dst), qty: src.stock || 0, note: `并入：${src.name}${src.spec ? ' ' + src.spec : ''}` }).op);
      DB.commit(ops); closeSheet(); toast('已合并');
    });
  });
}

/* ---------- 申报 ---------- */
const USE_ST = { pending: ['待处理', 'y'], done: ['已发放', 'g'], partial: ['部分发放', 'b'], rejected: ['已拒绝', 'r'] };
const BUY_ST = { pending: ['待采购', 'y'], ordered: ['已下单', 'b'], partial: ['部分到货', 'b'], stocked: ['已入库', 'g'], rejected: ['已拒绝', 'r'] };
/* 采购申报的每一行：name/spec/unit/qty/itemId 是库管员原来申购的；
   b = 采购调整后的内容（只存改过的字段）；drop = 采购决定不买；added = 采购新增的行；
   k = 库管员收货时改的名称/规格/单位；byKeeper = 库管员收货时新增的行；
   arr/inq = 累计收货入库数量（由库管员点数）；short = 没收齐就结束了 */
const jclone = o => JSON.parse(JSON.stringify(o));
const planOf = l => ({ itemId: l.itemId || null, name: l.name, spec: l.spec || '', unit: l.unit || '', qty: l.qty, ...(l.b || {}) });
const planQty = l => l.drop ? 0 : planOf(l).qty;
const toStockQty = l => r3((l.arr || 0) - (l.arrSt || 0));
const needStock = r => r.kind === 'buy' && r.status !== 'rejected' && (r.lines || []).some(l => toStockQty(l) > 0);
const recvOf = l => ({ ...planOf(l), ...(l.k || {}) });
const canReceive = r => r.kind === 'buy' && ['pending', 'ordered', 'partial', 'arrived'].includes(r.status);
function changeTags(l) {
  const t = [];
  if (l.byKeeper) t.push('收货新增'); else if (l.added) t.push('新增');
  if (l.drop) t.push('不买');
  if (l.b) {
    if (l.b.qty != null && l.b.qty !== l.qty) t.push('改了数量');
    if ((l.b.name != null && l.b.name !== l.name) || (l.b.spec != null && l.b.spec !== (l.spec || ''))) t.push('改了规格');
    if (l.b.unit != null && l.b.unit !== (l.unit || '')) t.push('改了单位');
  }
  if (l.k) {
    const p = planOf(l);
    if ((l.k.name != null && l.k.name !== p.name) || (l.k.spec != null && l.k.spec !== p.spec)) t.push('收货改了规格');
    if (l.k.unit != null && l.k.unit !== p.unit) t.push('收货改了单位');
  }
  if (l.short) t.push('没收齐');
  return t;
}
const stTag = (r) => { const m = (r.kind === 'buy' ? BUY_ST : USE_ST)[r.status] || [r.status, '']; return `<span class="tag ${m[1]}">${m[0]}</span>`; };

function useCard(r, act) {
  const lines = r.lines.map((l, i) => {
    const it = item(l.itemId); const st = it ? it.stock || 0 : 0;
    const right = act ? `<input data-li="${i}" inputmode="decimal" value="${fmt(Math.min(l.qty, Math.max(st, 0)) || 0)}" aria-label="发放数量">`
      : (r.given ? `<span class="num">发 ${fmt(r.given[i] || 0)}</span>` : '');
    return `<div class="line"><div class="mid">${esc(l.name)} ${esc(l.spec || '')}<small>申请 ${fmt(l.qty)} ${esc(l.unit || '')}${act ? `，在库 <b class="${st < l.qty ? 'neg' : ''}">${fmt(st)}</b>` : ''}</small></div>${right}</div>`;
  }).join('');
  return `<div class="card"><div class="t1"><span class="who">${esc(r.requester)}</span><span>${stTag(r)}</span></div>
    <div class="when">${fmtT(r.t)}${r.handledBy ? `，${esc(r.handledBy)} 处理` : ''}</div>${lines}
    ${r.note ? `<div class="note">备注：${esc(r.note)}</div>` : ''}${r.reason ? `<div class="note">拒绝原因：${esc(r.reason)}</div>` : ''}
    ${act ? `<div class="btns"><button class="btn warn sm" data-act="rejectUse" data-id="${r.id}">拒绝</button><button class="btn pri sm" data-act="approveUse" data-id="${r.id}">按填写数量发放</button></div>` : ''}</div>`;
}
function buyLine(l) {
  const p = planOf(l), v = recvOf(l); const tags = changeTags(l);
  const renamed = !l.added && ((v.name !== l.name) || (v.spec !== (l.spec || '')));
  const nums = [];
  if (l.byKeeper) nums.push('库管员收货时新增');
  else nums.push(l.added ? '采购新增' : `申购 ${fmt(l.qty)}`);
  if (!l.added && !l.drop && p.qty !== l.qty) nums.push(`调整为 ${fmt(p.qty)}`);
  if (l.inq) nums.push(`收货入库 ${fmt(l.inq)}`);
  const tagH = tags.map(t => `<span class="tag ${t === '不买' || t === '没收齐' ? 'r' : /新增/.test(t) ? 'b' : 'y'}">${t}</span>`).join(' ');
  return `<div class="line">${l.photo ? `<div class="thumb"><img src="${l.photo}" alt=""></div>` : ''}<div class="mid">

    closeSheet(); toast('已保存修改');
  };
}

      if (it && (it.name !== v.name || (it.spec || '') !== v.spec)) it = null;

      if (it) { if (c > 0) ops.push(...opsIn(it, c, '采购收货').ops); l.stItemId = it.id; return; }
      if (!(c > 0)) return;
      const nid = uid() + k;
      ops.push({ op: 'set', c: 'items', id: nid, d: { name: v.name, spec: v.spec, unit: v.unit, category: '', alias: '', returnable: false, stock: c, lent: 0, broken: 0, t, lu: t, hasPhoto: !!l.photo, pv: l.photo ? t : 0 } });
      if (l.photo) ops.push({ op: 'set', c: 'photos', id: nid, d: { img: l.photo, t } });
      ops.push(recOp({ type: 'new', itemId: nid, name: v.name, spec: v.spec, unit: v.unit, qty: c, note: '采购收货（新物品）' }).op);
      l.stItemId = nid;
    };
    rows.forEach((x, k) => {
      const l = x.l, c = got[k];
      const box = sh.querySelector(`[data-box="${x.i}"]`); const f = n => box.querySelector(`[data-f=${n}]`).value.trim();
      const p = planOf(l); const nv = { name: f('name') || p.name, spec: f('spec'), unit: f('unit') };
      const kk = {}; if (nv.name !== p.name) kk.name = nv.name; if (nv.spec !== p.spec) kk.spec = nv.spec; if (nv.unit !== p.unit) kk.unit = nv.unit;
      if (Object.keys(kk).length) l.k = kk;
      if (c > 0 || l.k) stockIn(l, recvOf(l), c, k);
      if (c > 0) { l.inq = r3((l.inq || 0) + c); l.arr = l.inq; l.arrSt = l.inq; total += c; }
      if (short && mode === 'end' && c < x.left) l.short = true;
    });
    extra.forEach((x, k) => {
      const l = { added: true, byKeeper: true, itemId: matchItemId(x.name, x.spec), name: x.name, spec: x.spec, unit: x.unit, qty: x.qty, inq: x.qty, arr: x.qty, arrSt: x.qty };
      stockIn(l, recvOf(l), x.qty, 100 + k); lines.push(l); total += x.qty;
    });
    const anyIn = lines.some(l => l.inq > 0);
    const status = (short && mode === 'more') ? 'partial' : anyIn ? 'stocked' : 'rejected';
    const d = { lines, status, stockedBy: me.name, st: t };
    const note = g('#rn').value.trim();
    if (note) d.arrNotes = [...(r.arrNotes || []), { t, by: me.name, text: note }];
    if (status === 'rejected') d.reason = '没有收到货';
    ops.push({ op: 'upd', c: 'requests', id: r.id, d: jclone(d) });
    DB.commit(ops); closeSheet();
    toast(status === 'partial' ? '已入库，剩下的等下一批' : status === 'rejected' ? '已结束：没有收到货' : '已收货入库');
  };
}

function lendRow(l, click) {

const TYPE = { in: '入库', new: '新建', out: '出库', lend: '借出', return: '归还', adjust: '盘点', merge: '合并' };
function signed(r) {
  if (r.type === 'in' || r.type === 'new') return ['+' + fmt(r.qty), 'plus'];
  if (r.type === 'out' || r.type === 'lend') return ['−' + fmt(r.qty), 'minus'];
  if (r.type === 'return') return [(r.state === '完好' ? '+' : '') + fmt(r.qty), r.state === '完好' ? 'plus' : ''];
  if (r.type === 'adjust') return [(r.qty > 0 ? '+' : '−') + fmt(Math.abs(r.qty)), r.qty > 0 ? 'plus' : 'minus'];
  return [fmt(r.qty), ''];
}

// 删除物品（不抹掉数据：标记 deleted，出入库记录保留，可撤销 / 找回）
function deleteItems(ids) {
  const its = ids.map(item).filter(i => i && !i.deleted);
  if (!its.length) return false;
  const lent = its.filter(i => (i.lent || 0) > 0);
  if (lent.length) { alert(`下面这些还有借出没还，先处理归还再删：\n${lent.map(i => `${i.name} ${i.spec || ''}（借出 ${fmt(i.lent)} ${i.unit || ''}）`).join('\n')}`); return false; }
  const withStock = its.filter(i => (i.stock || 0) !== 0);
  const msg = (its.length === 1 ? `删除「${its[0].name}${its[0].spec ? ' ' + its[0].spec : ''}」？` : `删除这 ${its.length} 样物品？`)
    + (withStock.length ? `\n\n其中还有库存：\n${withStock.slice(0, 8).map(i => `${i.name} ${i.spec || ''} ${fmt(i.stock)} ${i.unit || ''}`).join('\n')}${withStock.length > 8 ? `\n……等 ${withStock.length} 样` : ''}` : '')
    + '\n\n出入库记录会保留，误删可以在「更多 → 修改和删除记录」里找回。';
  if (!confirm(msg)) return false;
  const t = now(); const aid = uid();
  const ops = its.map(i => itemUpd(i.id, { deleted: true, delAt: t, delBy: me.name }));
  ops.push({ op: 'set', c: 'audit', id: aid, d: { t, by: me.name, action: '删除物品', items: its.map(i => clean({ id: i.id, name: i.name, spec: i.spec || '', stock: i.stock || 0, unit: i.unit || '' })) } });
  DB.commit(ops);
  if (S.sel) setSel(null);
  toast(`已删除 ${its.length} 样`, () => restoreItems(its.map(i => i.id), aid, true));
  return true;
}
function restoreItems(ids, auditId, isUndo) {
  const ops = ids.map(id => S.byId.get(id)).filter(i => i && i.deleted && !i.mergedInto).map(i => itemUpd(i.id, { deleted: false, lu: now() }));
  if (!ops.length) { toast('这些物品已经恢复过了'); return; }
  if (auditId) ops.push(isUndo ? { op: 'del', c: 'audit', id: auditId } : { op: 'upd', c: 'audit', id: auditId, d: { restored: true } });
  DB.commit(ops); toast(isUndo ? '已撤销' : `已找回 ${ops.length - (auditId ? 1 : 0)} 样物品`);
}
function auditLine(a) {
  if (a.action === '删除物品') {
    const n = (a.items || []).map(i => `${esc(i.name)}${i.spec ? ' ' + esc(i.spec) : ''}`);

  }
  const r = a.rec || {};
  return `<div class="mini"><span>${esc(a.by)} ${a.action}了：${TYPE[r.type] || ''} ${esc(r.name || '')} ${fmt(r.qty)} ${esc(r.unit || '')}${a.newQty != null ? ` → ${fmt(a.newQty)}` : ''}${a.restored ? '（已找回）' : (a.action === '删除' ? ` <button class="link" data-rs="${a.id}">找回</button>` : '')}</span><span>${fmtT(a.t)}</span></div>`;
}
function openAudit() {
  openSheet(`${head('修改和删除记录', '只在这里能看到。误删的可以点「找回」。')}
    ${S.audit.length ? S.audit.map(auditLine).join('') : '<div class="empty">没有修改过</div>'}`, sh => {
    sh.addEventListener('click', e => {
      const ri = e.target.closest('[data-ri]');
      if (ri) { const a = S.audit.find(x => x.id === ri.dataset.ri); if (a && confirm('把这些物品找回来？库存数量和删除前一样。')) { restoreItems((a.items || []).map(i => i.id), a.id, false); closeSheet(); } return; }
      const b = e.target.closest('[data-rs]'); if (!b) return;
      const a = S.audit.find(x => x.id === b.dataset.rs); if (!a) return;
      const r = { ...a.rec }; const it = item(r.itemId);
      if (!it) return alert('这样物品已经不在了，不能找回');
      if (!confirm('把这条记录找回来？库存会重新算上。')) return;
      const ops = [];
      if (r.type === 'in' || r.type === 'new') ops.push(itemUpd(it.id, { stock: INC(r.qty) }));
      else if (r.type === 'out') ops.push(itemUpd(it.id, { stock: INC(-r.qty) }));
      else if (r.type === 'adjust') ops.push(itemUpd(it.id, { stock: INC(r.qty) }));
      else if (r.type === 'lend') { ops.push(itemUpd(it.id, { stock: INC(-r.qty), lent: INC(r.qty) })); ops.push({ op: 'set', c: 'lends', id: r.lendId || uid(), d: clean({ t: r.t, ...base(it), person: r.person || '', qty: r.qty, returned: 0, open: true, by: r.by }) }); }
      else if (r.type === 'return') {
        const l = S.lends.find(x => x.id === r.lendId);
        if (l) ops.push({ op: 'upd', c: 'lends', id: l.id, d: { returned: INC(r.qty), open: r3(l.qty - l.returned - r.qty) > 0 } });
        if (r.state === '完好') ops.push(itemUpd(it.id, { stock: INC(r.qty), lent: INC(-r.qty) }));
        else if (r.state === '损坏') ops.push(itemUpd(it.id, { broken: INC(r.qty), lent: INC(-r.qty) }));
        else ops.push(itemUpd(it.id, { lent: INC(-r.qty) }));
      }
      const id = r.id; delete r.id;
      ops.push({ op: 'set', c: 'records', id, d: r }, { op: 'upd', c: 'audit', id: a.id, d: { restored: true } });
      DB.commit(ops); closeSheet(); toast('已找回');
    });
  });
}

/* ---------- 表格导入导出（SheetJS） ---------- */
let XP = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (XP) return XP;
  const urls = ['https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'];
  XP = new Promise((res, rej) => {
    const tryOne = i => {
      if (i >= urls.length) { XP = null; return rej(new Error('表格组件加载失败，检查网络')); }
      const s = document.createElement('script'); s.src = urls[i];
      s.onload = () => res(window.XLSX); s.onerror = () => { s.remove(); tryOne(i + 1); };
      document.head.appendChild(s);

    const bad = cellStr(rawQ) !== '' && !Number.isFinite(q);
    if (bad) extra.unshift({ k: '原表数量', v: cellStr(rawQ) });
    const ret = v('returnable');
    const x = { name, code: v('code'), spec: v('spec'), model: v('model'), unit: v('unit'), category: v('category') || sheetName, alias: v('alias'),
      shelf: v('shelf'), warehouse: v('warehouse'), place: v('place'), inDate: map.inDate == null ? '' : fmtDateCell(row[map.inDate]),

  rejectUse(id) {
    const reason = prompt('拒绝原因（可不填）'); if (reason === null) return;
    DB.commit([{ op: 'upd', c: 'requests', id, d: { status: 'rejected', reason: reason.trim(), handledBy: me.name, ht: now() } }]); toast('已拒绝');
  },
  buyOrdered: id => { DB.commit([{ op: 'upd', c: 'requests', id, d: { status: 'ordered', handledBy: me.name, ot: now() } }]); toast('已标记：已下单'); },
  buyEdit: id => { const r = S.reqs.find(x => x.id === id); if (r) openBuyEdit(r); },
  buyReject: id => { const reason = prompt('拒绝原因（可不填）'); if (reason === null) return; DB.commit([{ op: 'upd', c: 'requests', id, d: { status: 'rejected', reason: reason.trim(), handledBy: me.name, ht: now() } }]); toast('已拒绝'); },
  stockBuy: id => { const r = S.reqs.find(x => x.id === id); if (r) openReceive(r); },
  lendSort: id => { S.lendSort = id; render(); },
  ret: id => { const l = S.lends.find(x => x.id === id); if (l) openReturn(l); },
  rec: id => { if (!isKeeper()) return; const r = S.recs.find(x => x.id === id); if (r) openRecord(r); },
  burst: openBurst, retCats: openRetCats, audit: openAudit, import: openImport,
  expStock, expRec, expReq, expLend,
  seed: () => { if (confirm('载入 12 样示例物品？')) seed(); },
  selAll: () => { const l = filteredItems(); const all = l.length && l.every(i => S.sel.has(i.id)); l.forEach(i => all ? S.sel.delete(i.id) : S.sel.add(i.id)); renderItems(); renderFloat(); },
  selDel: () => { if (S.sel && S.sel.size) deleteItems([...S.sel]); },
  selCancel: () => setSel(null),
  wipe: () => { if (confirm('清空这部手机上的全部演示数据？')) { DB.reset(); toast('已清空'); } }
};
$('#main').addEventListener('click', e => {
  // 列表里点照片缩略图：直接看大图（多选状态下照常勾选）
  if (!S.sel && e.target.closest('.thumb img[data-view]')) return;
  const b = e.target.closest('[data-act],[data-item]'); if (!b) return;
  if (b.dataset.item) {
    if (S.lpEat && S.lpEat.id === b.dataset.item && Date.now() - S.lpEat.t < 1500) { S.lpEat = null; return; }
    S.lpEat = null;
    if (S.sel) { const id = b.dataset.item; S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); renderItems(); renderFloat(); return; }
    return openItem(b.dataset.item);
  }
  const f = ACT[b.dataset.act]; if (f) f(b.dataset.id, b);
});

// 点照片全屏看
document.addEventListener('click', e => {
  if (e.target.closest('.cam') || (S.sel && e.target.closest('.row'))) return;
  const box = e.target.closest('.photo.has'); const img = e.target.closest('img[data-view]') || (box && box.querySelector('img[data-view]'));
  if (!img) return;
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<img src="${img.src}" alt=""><button aria-label="关闭">×</button>`;
  v.onclick = () => v.remove(); document.body.appendChild(v);
});
// 安卓返回键：先关弹窗，再回库存页，最后才退出
(function appBack() {
  const A = capPlugin('App'); if (!isApp() || !A) return;
  A.addListener('backButton', () => {
    if (document.querySelector('.viewer')) { document.querySelector('.viewer').remove(); return; }
    if (document.querySelector('.mask')) { if (!document.querySelector('.mask .x')) return; closeSheet(); return; }
    if (S.sel) { setSel(null); return; }
    if (S.view !== 'stock') { S.view = 'stock'; doRender(); return; }
    A.exitApp();
  });
})();
// 离线缓存：没网时也能打开
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

boot();
</script>
