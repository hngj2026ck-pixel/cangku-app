name: 打包安卓 App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: 安装 Capacitor
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: 生成安卓工程
        working-directory: app
        run: |
          npx cap add android
          ./prepare-android.sh
          npx cap sync android
      - name: 打包 APK
        working-directory: app/android
        run: |
          mkdir -p ~/.android && cp ../debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle
          chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../cangku.apk
      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: 仓库 App 1.${{ github.run_number }}
          body: 下载下面的 cangku.apk，在安卓手机上安装。
          files: cangku.apk
          make_latest: true
