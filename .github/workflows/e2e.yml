name: 端到端测试（模拟器）
on:
  push:
    branches: [prod]
    paths: ['index.html', 'firestore.rules', 'tests/**', '.github/workflows/e2e.yml']
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm i --no-save firebase-tools@13
      - run: pip install playwright openpyxl && python -m playwright install --with-deps chromium
      - run: python -m http.server 8000 & sleep 1
      - run: npx firebase emulators:exec --only firestore,auth --project cangku-prod "python tests/e2e.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: '*.png' }
